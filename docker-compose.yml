services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fosales
      POSTGRES_PASSWORD: fosales
      POSTGRES_DB: fosales
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fosales -d fosales"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
